plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '7.0.0'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

sourceSets {
	main {
		resources {
			srcDirs += [
					'src/main/generated'
			]
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/nyakomod.accesswidener")

	runs {
		// This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
		datagenClient {
			inherit client
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			//vmArg "-Dfabric-api.datagen.strict-validation"

			runDir "build/datagen"
		}
	}
}

repositories {
	maven { url 'https://jitpack.io' } // ImmPtl

	maven { url 'https://maven.shedaniel.me' } // Cloth Config, REI

	maven { url = "https://mvn.devos.one/snapshots" } // Create and several dependencies

	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url "https://maven.nucleoid.xyz/" }
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		url = uri("https://ueaj.dev/maven")
	}
	maven { url 'https://maven.wispforest.io' }
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft("com.mojang:minecraft:${project.minecraft_version}")
	mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
	modImplementation('me.lucko:fabric-permissions-api:0.1-SNAPSHOT')

	modImplementation("maven.modrinth:stacc-api:${stacc_version}")
	modImplementation(include("eu.pb4:placeholder-api:${placeholder_api_version}"))

	// Trinkets
	modImplementation("dev.emi:trinkets:${trinkets_version}")

	// For some reason, required with this version of Trinkets
	modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}")
	modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}")

	// Include owo's sentinel library (prompts users to install owo)
	include("io.wispforest:owo-sentinel:${owo_version}")

	modImplementation("io.wispforest:owo-lib:${owo_version}")
	annotationProcessor "io.wispforest:owo-lib:${owo_version}"
	shadow(implementation('org.json:json:20220320'))
	modImplementation(include("io.github.tropheusj:milk-lib:${milklib_version}"))

	// Only include in dev environment:
	modRuntimeOnly("maven.modrinth:here-be-no-dragons:1.0.0")
	modRuntimeOnly("maven.modrinth:continuity:${continuity_version}")
	modRuntimeOnly("maven.modrinth:itemrename:${itemrename_version}")
	modRuntimeOnly("maven.modrinth:veindigging:${veindigging_version}")
	modRuntimeOnly("maven.modrinth:accurate-block-placement-reborn:${accurate_block_placement_version}")
	modRuntimeOnly(include("com.terraformersmc:modmenu:${mod_menu_version}"))
	modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")

	// Compile with REI for compatibility
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}")

	// Compile with immersive portals for compatibility
	modCompileOnly("com.github.iPortalTeam:ImmersivePortalsMod:${immptl_version}")

	// Stickers
	modImplementation files("libs/stickers-${stickers_version}.jar")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.18 upwards uses Java 17.
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

shadowJar {
	configurations = [project.configurations.shadow]
	archiveClassifier.set("dev")
}

remapJar {
	dependsOn(shadowJar)
	inputFile = tasks.shadowJar.archiveFile
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
